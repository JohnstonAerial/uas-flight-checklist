  };

  if (!prefs.sunrise && !prefs.sunset && !prefs.goldenMorning && !prefs.goldenEvening) {
    // Nothing selected — treat as "turn notifications off".
    setNotifStatus("Turning off notifications…");
    await unsubscribeFromPush();
    saveNotifPrefs(prefs);
    updateNotifButtonIndicator();
    setNotifStatus("Notifications turned off.");
    return;
  }

  setNotifStatus("Enabling notifications…");
  const ok = await subscribeToPush(prefs);
  if (ok) saveNotifPrefs(prefs);
  updateNotifButtonIndicator();
});

updateNotifButtonIndicator();

let searchTimeout;
$("locInput").addEventListener("input", (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  if(q.length < 2){ $("locResults").innerHTML = ""; return; }
  searchTimeout = setTimeout(async () => {
    try{
      const results = await geocode(q);
      $("locResults").innerHTML = results.map(r =>
        `<div class="modal-result" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${r.name}, ${r.admin1 || r.country}">
          ${r.name}${r.admin1 ? ", " + r.admin1 : ""}${r.country ? " — " + r.country : ""}
        </div>`
      ).join("") || '<div class="modal-result" style="cursor:default;color:var(--slate)">No matches</div>';
      document.querySelectorAll(".modal-result[data-lat]").forEach(el => {
        el.addEventListener("click", () => {
          const loc = { name: el.dataset.name, lat: parseFloat(el.dataset.lat), lon: parseFloat(el.dataset.lon) };
          saveLoc(loc);
          backdrop.classList.remove("open");
          boot(loc);
        });
      });
    }catch(err){ $("locResults").innerHTML = '<div class="modal-result" style="cursor:default;color:var(--rose)">Search failed</div>'; }
  }, 350);
});

$("useGps").addEventListener("click", () => {
  if(!navigator.geolocation){ alert("Location services aren't available in this browser."); return; }
  $("useGps").textContent = "Locating…";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const loc = { name: "Current location", lat: pos.coords.latitude, lon: pos.coords.longitude };
      saveLoc(loc);
      backdrop.classList.remove("open");
      $("useGps").textContent = "Use current location";
      boot(loc);
    },
    () => { alert("Couldn't get your location — check permissions."); $("useGps").textContent = "Use current location"; },
    { timeout: 8000 }
  );
});

// Opened from another page (the flight checklist's golden hour line) with ?lat=&lon=&name= :
// show that place. If this device has no saved place yet, remember it like a normal choice;
// if it already has one, use the link's place for this visit only and leave the saved one alone.
function linkLoc(){
  try{
    const q = new URLSearchParams(location.search);
    if(!q.has("lat") || !q.has("lon")) return null;
    const lat = parseFloat(q.get("lat")), lon = parseFloat(q.get("lon"));
    if(!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
    const name = (q.get("name") || "").replace(/[<>&"'`]/g, "").replace(/\s+/g, " ").trim().slice(0, 60);
    return { name: name || "Shared location", lat: lat, lon: lon };
  }catch(e){ return null; }
}

// Init
function initLocation(){
  const fromLink = linkLoc();
  if(fromLink){
    // Drop the place from the address bar so a refresh or bookmark doesn't keep it.
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
    if(!loadLoc()) saveLoc(fromLink);
    boot(fromLink);
    return;
  }
  const saved = loadLoc();
  if(saved){ boot(saved); return; }

  if(!navigator.geolocation){
    boot(DEFAULT_LOC);
    return;
  }
  // No saved location yet — ask for it up front instead of silently defaulting.
  $("app").innerHTML = '<div class="loading">Requesting your location…</div>';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const loc = { name: "Current location", lat: pos.coords.latitude, lon: pos.coords.longitude };
      saveLoc(loc);
      boot(loc);
    },
    () => { boot(DEFAULT_LOC); }, // denied, timed out, or unavailable — fall back quietly
    { timeout: 8000 }
  );
}
initLocation();
